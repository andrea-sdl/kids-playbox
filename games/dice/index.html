<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice Thrower · Playbox</title>
  <meta name="description" content="Pick a buddy and roll the dice. Works offline.">
  <meta name="theme-color" content="#ff7a59">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Playbox">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="dice.css">
  <script type="module" src="dice.js"></script>
</head>
<body data-mascot="princess">
  <header class="topbar">
    <a class="chunky-button icon-button" href="../../" aria-label="Back to all games" title="All games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1>Dice Thrower</h1>
    <button class="chunky-button icon-button sound-button" type="button" aria-pressed="true" aria-label="Sound">
      <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="chunky-button icon-button star-button favorite-button" type="button"></button>
  </header>

  <main>
    <fieldset class="picker">
      <legend>Choose your buddy</legend>
      <div class="picker-options"></div>
    </fieldset>

    <section class="stage" aria-label="Dice table">
      <div class="scene" aria-hidden="true"></div>
      <div class="buddy">
        <div class="bubble" aria-hidden="true"></div>
        <div class="mascot" aria-hidden="true"></div>
      </div>
      <button class="mat" type="button" aria-label="Roll the dice">
        <span class="dice-tray"></span>
      </button>
    </section>

    <p class="result" aria-live="polite">
      <span class="result-total">?</span>
      <span class="result-detail">Tap Roll to throw the dice!</span>
    </p>

    <div class="controls">
      <div class="count-control" role="group" aria-label="How many dice">
        <button class="chunky-button icon-button count-minus" type="button" aria-label="One less die">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
        </button>
        <output class="count-value" aria-live="polite">2 dice</output>
        <button class="chunky-button icon-button count-plus" type="button" aria-label="One more die">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="chunky-button roll-button" type="button">Roll!</button>
    </div>

    <section class="results-panel" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title">Your rolls</h2>
        <button class="chunky-button clear-button" type="button">Clear</button>
      </div>
      <dl class="stats">
        <div><dt>Rolls</dt><dd class="stat-rolls">0</dd></div>
        <div><dt>Best total</dt><dd class="stat-best">–</dd></div>
      </dl>
      <h3>Last rolls</h3>
      <ol class="history"></ol>
      <p class="history-empty">No rolls yet.</p>
      <h3>How often each number came up</h3>
      <ul class="face-bars"></ul>
    </section>
  </main>

  <footer class="site-footer">
    Brought to you by Andrea Grassi,
    <a href="https://givemethechills.com" target="_blank" rel="noopener">Givemethechills</a>
  </footer>
</body>
</html>
