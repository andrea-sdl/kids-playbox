<!doctype html>
<html lang="en" data-root="../../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="blocks.pageTitle">Blocks · Playbox</title>
  <meta name="description" content="Build anything with 3D blocks. Works offline.">
  <meta name="theme-color" content="#3490dc">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Playbox">
  <link rel="modulepreload" href="../../vendor/three/three.min.js">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="blocks.css">
  <script type="module" src="blocks.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="chunky-button icon-button" href="../../" aria-label="Back to all games" title="All games" data-i18n-attr="aria-label:common.back title:common.allGames">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 data-i18n="game.blocks.title">Blocks</h1>
    <button class="chunky-button icon-button sound-button" type="button" aria-pressed="true" aria-label="Sound" data-i18n-attr="aria-label:common.sound">
      <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="chunky-button icon-button fullscreen-button" type="button" aria-pressed="false"></button>
    <button class="chunky-button icon-button star-button favorite-button" type="button"></button>
  </header>

  <main class="builder">
    <div class="viewport">
      <div class="canvas-holder" role="application" aria-label="Building area" data-i18n-attr="aria-label:blocks.area"></div>
      <p class="loading" data-i18n="blocks.loading">Getting the blocks ready…</p>

      <div class="overlay overlay-top-left">
        <button class="chunky-button icon-button undo-button" type="button" aria-label="Undo" title="Undo (Ctrl+Z)" data-i18n-attr="aria-label:blocks.undo title:blocks.undoTitle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg>
        </button>
        <button class="chunky-button clear-button" type="button" data-i18n="common.clear">Clear</button>
      </div>

      <div class="overlay overlay-top-right time-panel">
        <button class="time-toggle" type="button" aria-expanded="false" aria-controls="time-controls" title="Time of day" data-i18n-attr="title:blocks.timeOfDay"><span class="time-icon" aria-hidden="true"></span><span class="time-text">12:00</span></button>
        <div class="time-controls" id="time-controls">
          <input class="time-slider" type="range" min="0" max="24" step="0.25" value="12" aria-label="Time of day" data-i18n-attr="aria-label:blocks.timeOfDay">
          <label class="clock-toggle"><input class="clock-input" type="checkbox"> <span data-i18n="blocks.matchClock">Match my clock</span></label>
        </div>
      </div>

      <div class="overlay overlay-bottom-right">
        <div class="focus-slot"></div>
        <button class="chunky-button icon-button zoom-in" type="button" aria-label="Zoom in" data-i18n-attr="aria-label:common.zoomIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
        </button>
        <button class="chunky-button icon-button zoom-out" type="button" aria-label="Zoom out" data-i18n-attr="aria-label:common.zoomOut">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <p class="hint" aria-live="polite" data-i18n="blocks.hint">Tap to build · Drag to look around · Pinch to zoom</p>
    </div>

    <div class="dock" data-panel="shapes">
      <div class="dock-row dock-main">
        <div class="tools segmented" role="radiogroup" aria-label="Tool" data-i18n-attr="aria-label:blocks.toolGroup"></div>
        <button class="chunky-button rotate-button" type="button" title="Turn the block (R)" data-i18n="blocks.turn" data-i18n-attr="title:blocks.turnTitle">⟳ Turn</button>
      </div>
      <!-- On phones only one palette shows at a time, picked with these tabs. -->
      <div class="dock-tabs" role="tablist">
        <button class="dock-tab" type="button" role="tab" data-panel="shapes"><span class="tab-preview shape-preview" aria-hidden="true"></span><span data-i18n="blocks.tab.shape">Shape</span></button>
        <button class="dock-tab" type="button" role="tab" data-panel="colors"><span class="tab-preview color-preview" aria-hidden="true"></span><span data-i18n="blocks.tab.color">Color</span></button>
        <button class="dock-tab" type="button" role="tab" data-panel="look"><span class="tab-preview look-preview" aria-hidden="true"></span><span data-i18n="blocks.tab.look">Look</span></button>
      </div>
      <div class="dock-row palette shapes" data-panel="shapes" role="radiogroup" aria-label="Block shape" data-i18n-attr="aria-label:blocks.shapeGroup"></div>
      <div class="dock-row palette colors" data-panel="colors" role="radiogroup" aria-label="Color" data-i18n-attr="aria-label:blocks.colorGroup"></div>
      <div class="dock-row palette look" data-panel="look">
        <div class="finish segmented" role="radiogroup" aria-label="Look" data-i18n-attr="aria-label:blocks.lookGroup"></div>
        <div class="textures" role="radiogroup" aria-label="Texture" data-i18n-attr="aria-label:blocks.textureGroup"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>
      <span data-i18n="common.footer">Brought to you by Andrea Grassi,</span>
      <a href="https://givemethechills.com" target="_blank" rel="noopener">Givemethechills</a>
    </p>
    <div class="lang-slot"></div>
  </footer>
</body>
</html>
