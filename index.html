<!doctype html>
<html lang="en" data-root="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playbox</title>
  <meta name="description" content="Games and little tools for kids. Works offline.">
  <meta name="theme-color" content="#ff7a59">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Playbox">
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="home.css">
  <script type="module" src="home.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <img src="icons/icon.svg" alt="" width="44" height="44">
      <h1>Playbox</h1>
    </a>
    <div class="lang-slot"></div>
  </header>

  <main>
    <p class="hello" data-i18n-html="home.hello">Pick a game. Tap the <span class="inline-star" aria-hidden="true">★</span> to keep your best ones at the top.</p>

    <div class="filters" role="group" aria-label="Show games" data-i18n-attr="aria-label:home.showGames">
      <button class="chunky-button filter" type="button" data-filter="all" aria-pressed="true" data-i18n="home.all">All games</button>
      <button class="chunky-button filter" type="button" data-filter="favorites" aria-pressed="false" data-i18n="home.favorites">★ Favorites</button>
      <button class="chunky-button whats-new-button" type="button"><span data-i18n="whatsNew.button">✨ What’s new</span><span class="whats-new-dot" hidden></span></button>
    </div>

    <ul class="game-grid" aria-live="polite"></ul>
    <p class="empty-favorites" hidden data-i18n="home.noFavorites">No favorites yet. Tap a star to add one!</p>

    <section class="offline-bar" hidden>
      <p class="offline-summary"></p>
      <button class="chunky-button save-offline" type="button" data-i18n="home.saveAll">Save all games for offline</button>
    </section>
    <dialog class="whats-new" aria-labelledby="whats-new-title">
      <div class="whats-new-head">
        <h2 id="whats-new-title" data-i18n="whatsNew.title">What’s new</h2>
        <button class="chunky-button whats-new-close" type="button" data-i18n="whatsNew.close">Close</button>
      </div>
      <ol class="release-list"></ol>
    </dialog>
  </main>

  <footer class="site-footer">
    <p>
      <span data-i18n="common.footer">Brought to you by Andrea Grassi,</span>
      <a href="https://givemethechills.com" target="_blank" rel="noopener">Givemethechills</a>
    </p>
    <div class="lang-slot"></div>
  </footer>
</body>
</html>
